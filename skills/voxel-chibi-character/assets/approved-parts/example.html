<!doctype html><meta charset="utf-8"><title>Approved local-part examples</title>
<style>body{margin:0;background:#142131;color:#e8edf6;font:16px system-ui}header{position:absolute;left:20px;top:14px;z-index:2}small{display:block;color:#b3c0ce;margin-top:5px}canvas{display:block}</style>
<header id="label"></header>
<script type="importmap">{"imports":{"three":"../dependencies/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {createApprovedPart,approvedPose} from './approved-parts.mjs';
const q=new URLSearchParams(location.search),kind=q.get('part')||'spiral',view=q.get('view')||'three',neutral=q.has('neutral');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor('#142131');renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight('#ffffff','#5d6878',2));const light=new THREE.DirectionalLight('#ffffff',3);light.position.set(4,6,8);scene.add(light);
const pose=approvedPose(kind);const group=createApprovedPart(THREE,kind,{rotation:neutral?[0,0,0]:pose.rotation,order:pose.order,includeMotifs:true});scene.add(group);
const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),height=Math.max(size.y,size.x*.85,size.z, .4)*1.5,aspect=innerWidth/innerHeight;
const camera=new THREE.OrthographicCamera(-height*aspect/2,height*aspect/2,height/2,-height/2,.01,100);
const offset=view==='front'?[0,0,6]:view==='side'?[6,0,0]:view==='top'?[0,6,.001]:[4,3,6];camera.position.copy(center).add(new THREE.Vector3(...offset));camera.lookAt(center);camera.updateProjectionMatrix();renderer.render(scene,camera);
document.getElementById('label').innerHTML=`${kind} · ${view} · ${neutral?'局部成形':'整体倾斜后'}<small>岁己 V4 认可部件 · 真实几何渲染；尺寸与饰件不是所有角色的默认值</small>`;
window.example={scene,group,camera,renderer};
</script>
