<header><div><small>MODEL LAB / 01</small><h1>角色试验室</h1></div><span id="summary">正在准备场景</span></header>
<main><aside><section><h2>添加角色</h2><div class="row"><button data-add="silverWolf">＋ 银灰狼耳少女</button></div><label class="upload">从本机导入模型<input id="files" type="file" multiple accept=".glb,.gltf,.bin,.png,.jpg,.jpeg,.webp,.ktx2"></label><p class="muted">支持多选 GLB；glTF 请同时选择 .bin 和纹理。文件仅在此浏览器读取，刷新后需重新导入。</p><div id="messages" role="status" aria-live="polite"></div></section><section><h2>场景中的模型 <span id="count">0</span></h2><div id="models"></div></section></aside>
